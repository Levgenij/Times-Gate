# Copy to config.toml (gitignored) and edit, or use the settings page (tray icon -> Налаштування).
# Values below are the defaults unless marked otherwise; any option can be omitted.
# Saving from the settings page rewrites config.toml without these comments.
# No secrets here: Google OAuth client and tokens live in secrets/ (gitignored).

[device]
ip = "192.168.1.60"        # required; find it: POST https://app.divoom-gz.com/Device/ReturnSameLANDevice
port = 9000
path = "/divoom_api"
timeout = 10               # seconds per request
jpeg_quality = 90
# Command sent when timesgate stops (Ctrl+C, console window closed, SIGTERM); default: none.
# Not sent if the PC loses power, sleeps or crashes. Your device's clock ids:
#   GET https://app.divoom-gz.com/Channel/Get5LcdInfoV2?DeviceType=LCD&DeviceId=<DeviceId>
# on_exit = { Command = "Channel/Set5LcdWholeClockId", ClockId = 581 }   # one clock across all 5 screens

[theme]
background = "#000000"
text = "#ffffff"
muted = "#8a8a8a"          # labels
dim = "#505050"            # footers (update time / date)
up = "#22c55e"             # chart line when price is up
down = "#ef4444"
up_fill = "#0b3d1d"        # area under the chart line
down_fill = "#4a1212"
cyrillic_font = "segoeui.ttf"   # any .ttf with Cyrillic; Segoe UI ships with Windows

[log]
level = "INFO"             # DEBUG also logs every send

[ui]
enabled = true             # settings page + tray icon
port = 8765                # http://127.0.0.1:8765, this PC only; change takes effect after a restart

# Each [[screen]] is one of the 5 panels (slot 1 = leftmost).
# Its [[screen.widgets]] are a priority list: the slot shows the first widget that has something to show.
# Options every widget has:
#   every  - seconds between runs
#   retry  - seconds before retrying after a failure (default: every)
#   align  - run on multiples of `every`, e.g. minute boundaries (default: false)

[[screen]]
slot = 1

[[screen.widgets]]
type = "calendar"          # next Google Calendar events and tasks; nothing coming within `days` -> prices below
every = 300
calendar = "primary"       # or another calendar id from Google Calendar settings
tasks = true               # also Google Tasks; undated ones go last (needs the Google Tasks API enabled)
tasklist = "@default"      # "My Tasks"
days = 7
count = 4                  # 1-4 rows
past = 1                   # today's finished events kept on top in grey, above a red "now" line (0 to count-1)
client_secret = "secrets/client_secret*.json"  # the same OAuth client as gmail
token = "secrets/token_calendar.json"          # its own token, read-only events (+ tasks); created by "sign in"

[[screen.widgets]]
type = "prices"            # Binance last prices, up to 4 rows
every = 300
market = "futures"         # "futures" (USDⓈ-M perpetuals) or "spot"; ALCH/SPY/BSB exist only as futures
quote = "USDT"
symbols = ["BTC", "ALCH", "SPY", "BSB"]

[[screen]]
slot = 2

[[screen.widgets]]
type = "gmail"             # shown only when the unread count grows; otherwise the slot falls through
every = 60
label = "INBOX"            # all tabs; "CATEGORY_PERSONAL" = Primary tab only
client_secret = "secrets/client_secret*.json"  # OAuth client (Desktop app); paths are relative to this file
token = "secrets/token_gmail.json"   # created by "sign in" (settings -> Система) or python -m timesgate --google-auth
forms = ["непрочитаний", "непрочитані", "непрочитаних"]  # label for 1 / 2-4 / 5+

[[screen.widgets]]
type = "rates"             # PrivatBank buy / sell to UAH
every = 18000              # 5 hours
retry = 300
currencies = ["USD", "EUR"]  # 1-2

[[screen]]
slot = 3

[[screen.widgets]]
type = "clock"
every = 60
align = true               # redraw exactly on the minute
blink = true               # colon blinks (2-frame animation looped by the device)
date = true
date_format = "%d.%m"
weekdays = ["Пон", "Вів", "Сер", "Чет", "П’ят", "Суб", "Нед"]  # Monday first
time_size = 42
date_size = 14

[[screen]]
slot = 4

[[screen.widgets]]
type = "chart"             # Binance candle closes
every = 300
market = "futures"
symbol = "BTCUSDT"
interval = "15m"
candles = 96               # 96 x 15m = 24 h
title = "BTC 24h"

[[screen]]
slot = 5

[[screen.widgets]]
type = "weather"           # Open-Meteo, no API key
every = 900
place = "LONDON"
lat = 51.5074
lon = -0.1278
timezone = "Europe/London"
icon = true                # sun / moon / clouds / rain / snow / storm / fog icon next to the temperature
forecast = true            # tomorrow and the day after at the bottom: weekday, small icon, max/min

# Also available:
# [[screen.widgets]]
# type = "text"
# every = 3600
# text = "Hello\nWorld"
# size = 22
# cyrillic = false         # true = use theme.cyrillic_font
